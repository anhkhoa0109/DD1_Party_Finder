const KEY="dd1pf_v11_roster";
const heroById=Object.fromEntries(DATA.heroes.map(h=>[h.id,h]));
let roster=loadRoster();
function loadRoster(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(roster))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function count(id){return roster.filter(x=>x.heroId===id).length}
function readyCount(id){return roster.filter(x=>x.heroId===id&&x.ready).length}
function addHero(id){roster.push({id:uid(),heroId:id,ready:true});save();render()}
function removeHero(id){let i=roster.map(x=>x.heroId).lastIndexOf(id);if(i>=0)roster.splice(i,1);save();render()}
function toggleHero(x){x.ready=!x.ready;save();render()}
function resetRoster(){if(confirm("Reset your entire roster?")){roster=[];save();render()}}
function exportRoster(){const blob=new Blob([JSON.stringify({version:1,roster},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dd1-party-finder-roster.json";a.click();URL.revokeObjectURL(a.href)}
function importRoster(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.roster))throw 0;roster=d.roster.filter(x=>heroById[x.heroId]).map(x=>({id:x.id||uid(),heroId:x.heroId,ready:!!x.ready}));save();render();alert("Roster imported.")}catch(e){alert("Invalid roster file.")}};r.readAsText(file)}
function partyNeed(p){
 const req=[p.r4,p.r3,p.r2,p.r1], used={}; let missing=[];
 for(const id of req){used[id]=(used[id]||0)+1}
 for(const [id,n] of Object.entries(used)){const avail=readyCount(id);if(avail<n)missing.push({id,need:n-avail})}
 return {available:missing.length===0,missing}
}
function portrait(id){return heroById[id]?.portrait||""}
function partyCard(p){
 const q=partyNeed(p);
 const slots=[["R4",p.r4],["R3",p.r3],["R2",p.r2],["R1",p.r1]];
 const status=q.available?`<div class="available-box">✓ Ready to run with your current roster</div>`:
 `<div class="missing-box">⚠ One hero away: ${q.missing.map(m=>`Need ${m.need} × ${heroById[m.id].name}`).join(", ")}</div>`;
 return `<article class="party">
 <div class="party-top"><div><span class="party-title">${p.label}</span><span class="category ${p.category==='Recommended'?'cat-rec':p.category==='Fun'?'cat-fun':''}">${p.category}</span>${p.gameName?`<div class="small">Game name: ${p.gameName}</div>`:""}</div><div class="rating">★ ${p.rating.toFixed(1)}</div></div>
 <div class="slots">${slots.map(([r,id])=>`<div class="slot ${q.available?'ok':q.missing.some(m=>m.id===id)?'missing':''}"><div class="rank">${r}</div><img src="${portrait(id)}" alt=""><div class="slot-name">${heroById[id].name}</div></div>`).join("")}</div>
 ${status}<div class="detail"><div><b>Best for:</b> ${p.bestFor}</div><div><b>Strengths:</b> ${p.strengths}</div><div><b>Weaknesses:</b> ${p.weaknesses}</div></div>
 </article>`
}
function renderRoster(){
 const ready=roster.filter(x=>x.ready).length, off=roster.length-ready;
 let html=`<section class="panel"><div class="section-title"><h2>My recruited heroes</h2><span class="count">${roster.length} heroes · ${ready} ready · ${off} not ready</span></div>
 <div class="small" style="margin-bottom:9px">Add/remove individual hero instances, then tap each instance to switch READY / NOT READY. Party matching uses READY heroes only.</div>
 <div class="hero-grid">${DATA.heroes.map(h=>`<div class="hero"><img src="${h.portrait}" alt=""><div class="hero-name">${h.name}${h.optional?'*':''}</div><div class="hero-actions"><button class="btn" onclick="addHero('${h.id}')">＋ Add</button><button class="btn" onclick="removeHero('${h.id}')">− Remove</button></div></div>`).join("")}</div></section>`;
 html+=`<section class="panel"><div class="section-title"><h2>Current roster</h2><span class="count">${ready} ready</span></div>`;
 if(!roster.length) html+=`<div class="empty">No heroes yet. Add the heroes you currently own above.</div>`;
 else DATA.heroes.forEach(h=>{let xs=roster.filter(x=>x.heroId===h.id);if(!xs.length)return;
 html+=`<div class="roster-row"><img src="${h.portrait}" alt=""><div class="roster-info"><div class="roster-name">${h.name}</div><div class="chips">${xs.map((x,i)=>`<span class="chip ${x.ready?'ready':'off'}">#${i+1} ${x.ready?'READY':'NOT READY'}</span>`).join("")}</div></div><div class="roster-actions">${xs.map((x,i)=>`<button class="btn ${x.ready?'ready':'off'}" onclick='toggleHero(roster.find(r=>r.id==="`+x.id+`"))'>#${i+1}</button>`).join("")}</div></div>`});
 html+=`</section>`;
 return html;
}
function renderParties(){
 const query=(document.getElementById("partySearch")?.value||"").toLowerCase();
 const mode=document.getElementById("partyMode")?.value||"available";
 let arr=DATA.parties.filter(p=>{
   const hay=[p.label,p.category,p.bestFor,p.strengths,p.weaknesses,p.gameName,...[p.r4,p.r3,p.r2,p.r1].map(x=>heroById[x].name)].join(" ").toLowerCase();
   if(query&&!hay.includes(query))return false;
   const q=partyNeed(p);
   if(mode==="available"&&!q.available)return false;
   if(mode==="oneaway"&&(q.available||q.missing.reduce((a,x)=>a+x.need,0)>1))return false;
   if(mode==="recommended"&&p.category!=="Recommended")return false;
   return true;
 });
 arr.sort((a,b)=>b.rating-a.rating);
 return `<section class="panel"><div class="section-title"><h2>Find practical parties</h2><span class="count">${arr.length} shown</span></div>
 <div class="controls"><input id="partySearch" placeholder="Search hero, party, dungeon..." value="${query}"><select id="partyMode" style="background:#0f151e;color:#eee;border:1px solid #2c394b;border-radius:10px;padding:8px"><option value="available" ${mode==="available"?"selected":""}>Ready now</option><option value="oneaway" ${mode==="oneaway"?"selected":""}>One hero away</option><option value="recommended" ${mode==="recommended"?"selected":""}>Recommended</option><option value="all" ${mode==="all"?"selected":""}>All practical + fun</option></select></div>
 <div class="small" style="margin-top:7px">No dungeon filter in V1.1. Use search for a dungeon or hero; dedicated Party Filter is planned for a later version.</div></section>
 <div id="partyList">${arr.length?arr.map(partyCard).join(""):`<div class="empty">No matching parties. Try “All practical + fun”, another hero, or add the missing hero.</div>`}</div>`;
}
function renderSettings(){
 return `<section class="panel"><div class="section-title"><h2>Roster data</h2></div>
 <p class="small">Your roster is saved automatically in this browser/site origin. GitHub Pages has its own storage origin, so use Export/Import when moving from a local file or another URL/device.</p>
 <div class="controls"><button class="btn" onclick="exportRoster()">Export JSON</button><label class="btn" style="text-align:center;cursor:pointer">Import JSON<input type="file" accept=".json,application/json" hidden onchange="importRoster(this.files[0])"></label><button class="btn off" onclick="resetRoster()">Reset</button></div></section>
 <section class="panel"><div class="section-title"><h2>V1.1 scope</h2></div><div class="small">✓ Individual hero instances<br>✓ Ready / Not Ready<br>✓ Rank-aware matching<br>✓ Available Now<br>✓ One Hero Away<br>✓ Practical / Situational / Fun categories<br>✓ Strengths / Weaknesses / Best For<br>✓ Hero coverage across the database<br>✓ Mobile-first vertical layout<br>✓ Offline PWA<br>× Party Filter intentionally deferred to a later version</div></section>
 <section class="panel"><div class="section-title"><h2>Research references</h2></div>${DATA.sources.map(s=>`<div style="margin:8px 0;font-size:11px"><a href="${s.url}" target="_blank" rel="noopener" style="color:#9fc7ff">${s.title}</a><div class="small">${s.note}</div></div>`).join("")}</section>`;
}
function render(){
 const active=document.querySelector(".tab.active")?.dataset.tab||"roster";
 document.getElementById("content").innerHTML=active==="roster"?renderRoster():active==="parties"?renderParties():renderSettings();
 if(active==="parties"){
  document.getElementById("partySearch")?.addEventListener("input",render);
  document.getElementById("partyMode")?.addEventListener("change",render);
 }
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");render()}));
render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
